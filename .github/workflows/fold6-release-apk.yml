name: PiliBro Fold6 Release APK
on:
  workflow_dispatch:
    inputs:
      mpv_verbose:
        description: "把 mpv 日志开到 info（诊断用）"
        type: boolean
        default: false
jobs:
  android-release:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Apply media_kit Android decoder lab hook
        shell: pwsh
        run: lib/scripts/patch_media_kit_android_decoder_lab.ps1
      - name: Set and Extract version
        shell: pwsh
        env:
          BUILD_NUMBER_OVERRIDE: "0"
          RELEASE_TAG_OVERRIDE: ""
        run: lib/scripts/build.ps1 android
      - name: Restore fixed signing key from Actions cache
        id: signkey
        uses: actions/cache/restore@v4
        with:
          path: |
            android/app/fold6-release.p12
            android/fold6-signing.json
          key: fold6-signing-key-v2
      - name: Seed the signing key on a cache miss
        if: steps.signkey.outputs.cache-hit != 'true'
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.FOLD6_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.FOLD6_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGN_KEYSTORE_BASE64" || { echo "::error::signing cache miss and FOLD6_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$SIGN_STORE_PASSWORD" || { echo "::error::signing cache miss and FOLD6_KEYSTORE_PASSWORD is empty"; exit 1; }
          mkdir -p android/app
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 -d > android/app/fold6-release.p12
          printf '{"keystore_file":"fold6-release.p12","alias":"fold6key","store_password":"%s","key_password":"%s"}\n' \
            "$SIGN_STORE_PASSWORD" "$SIGN_STORE_PASSWORD" > android/fold6-signing.json
          test -s android/app/fold6-release.p12
      - name: Save the signing key to Actions cache
        if: steps.signkey.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            android/app/fold6-release.p12
            android/fold6-signing.json
          key: fold6-signing-key-v2
      - name: Write key.properties
        shell: bash
        run: |
          set -euo pipefail
          PW=$(sed -n 's/.*"store_password":"\([^"]*\)".*/\1/p' android/fold6-signing.json)
          ALIAS=$(sed -n 's/.*"alias":"\([^"]*\)".*/\1/p' android/fold6-signing.json)
          test -n "$PW" || { echo "::error::the restored key metadata has no store password"; exit 1; }
          printf 'storeFile=fold6-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PW" "$ALIAS" "$PW" > android/key.properties
          sed 's/Password=.*/Password=***/' android/key.properties
      - name: Record the signing key fingerprint
        shell: bash
        run: sha256sum android/app/fold6-release.p12
      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=pili_release.json --dart-define=MPV_VERBOSE=${{ inputs.mpv_verbose }} --no-pub
      - name: Rename
        shell: bash
        run: |
          ls -l build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk PiliBro_fold6_release.apk
      - name: Verify the fixed signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -path '*build-tools*/apksigner' -type f | sort -V | tail -1)
          fi
          "$APKSIGNER" verify --print-certs PiliBro_fold6_release.apk | tee certs.txt
          grep -qi '97af542399882a8e6fe6c7ca9f80e8a955f32e0a97c2b86e8602b0883a42568e' certs.txt \
            || { echo "::error::APK is not signed with the fixed fold6 key"; exit 1; }
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PiliBro_fold6_release.apk
          path: PiliBro_fold6_release.apk
          if-no-files-found: error
          archive: false
